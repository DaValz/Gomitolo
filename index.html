  <noscript>Gomitolo ha bisogno di JavaScript per funzionare.</noscript>
  <script>
    /* lingua: scelta salvata, altrimenti quella del dispositivo (italiano → it, tutto il resto → en) */
    (function () {
      var l = null; try { l = localStorage.getItem('gomitolo-lang'); } catch (e) {}
      if (l !== 'it' && l !== 'en') l = /^it\b/i.test(navigator.language || '') ? 'it' : 'en';
      document.documentElement.lang = l;
      document.write('<script src="' + (l === 'en' ? 'data.en.js' : 'data.js') + '"><\/script>');
    })();
  </script>
